name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Dependency audit (fails on vulnerable packages)
        shell: pwsh
        run: |
          $bad = $false
          foreach ($p in Get-ChildItem src -Recurse -Filter *.csproj) {
            dotnet restore $p.FullName | Out-Null
            $out = dotnet list $p.FullName package --vulnerable --include-transitive 2>&1 | Out-String
            Write-Host $out
            if ($out -match '(?m)^\s+>\s') { $bad = $true }
          }
          if ($bad) { Write-Error "Vulnerable NuGet packages found."; exit 1 }
      - name: Unit tests
        shell: pwsh
        run: ./test.ps1 -Configuration Release
      - name: Build the installer
        shell: pwsh
        run: ./release.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: Shazim-Setup
          path: dist/*
          retention-days: 14
